<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CrossConnect — Set New Password</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="cc-login-bg d-flex align-items-center justify-content-center min-vh-100">

<div class="card cc-login-card shadow-lg" style="width: 420px;">
  <div class="card-body p-4">
    <h5 class="fw-bold mb-1" style="color: var(--cc-navy);">Set a new password</h5>
    <p class="text-muted small mb-3">Your temporary password must be changed before continuing.</p>

    {% if error %}
    <div class="alert alert-danger py-2 small">
      <i class="bi bi-exclamation-triangle-fill me-1"></i>{{ error }}
    </div>
    {% endif %}

    <form method="post" action="/change-password">
      <div class="mb-3">
        <label class="form-label fw-semibold small">Current (temporary) password</label>
        <input type="password" class="form-control" name="current_password" required autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold small">New password <span class="text-muted">(min 10 chars)</span></label>
        <input type="password" class="form-control" name="new_password" required>
      </div>
      <div class="mb-4">
        <label class="form-label fw-semibold small">Confirm new password</label>
        <input type="password" class="form-control" name="confirm_password" required>
      </div>
      <button type="submit" class="btn cc-btn-primary w-100 fw-semibold">
        Update password &amp; continue
      </button>
    </form>
  </div>
</div>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
