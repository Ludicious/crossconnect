<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CrossConnect — Login</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="cc-login-bg d-flex align-items-center justify-content-center min-vh-100">

<div class="card cc-login-card shadow-lg" style="width: 380px;">
  <div class="card-body p-4">
    <div class="text-center mb-4">
      <div class="cc-logo-mark mb-2">
        <i class="bi bi-diagram-3-fill" style="font-size: 2.5rem; color: var(--cc-accent);"></i>
      </div>
      <h4 class="fw-bold mb-0" style="color: var(--cc-navy);">CrossConnect</h4>
      <p class="text-muted small mb-0">Infrastructure cabling management</p>
    </div>

    {% if error %}
    <div class="alert alert-danger py-2 small">
      <i class="bi bi-exclamation-triangle-fill me-1"></i>{{ error }}
    </div>
    {% endif %}

    <form method="post" action="/login">
      <div class="mb-3">
        <label for="username" class="form-label fw-semibold small">Username</label>
        <input type="text" class="form-control" id="username" name="username"
               autocomplete="username" autofocus required>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label fw-semibold small">Password</label>
        <input type="password" class="form-control" id="password" name="password"
               autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn cc-btn-primary w-100 fw-semibold">
        Sign in
      </button>
    </form>
  </div>
</div>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
